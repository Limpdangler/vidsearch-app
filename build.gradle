plugins {
    id 'com.android.application' version '8.5.2'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'io.github.limpdangler.vidsearch'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.limpdangler.vidsearch'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'vidsearch-app'
            keyAlias 'vidsearch'
            keyPassword 'vidsearch-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
